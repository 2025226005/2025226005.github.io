<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>SSAIL · 콘텐츠 관리</title>
  <style>
    body { margin: 0; background: #faf9fb; color: #24212a; font: 16px/1.7 system-ui, sans-serif; }
    #status, .ssail-login { max-width: 680px; margin: 10vh auto; padding: 32px; }
    .brand { color: #a51c37; font-weight: 800; letter-spacing: .15em; }
    h1 { font-size: 30px; line-height: 1.3; }
    a { color: #a51c37; } p { white-space: pre-line; }
    .note { padding: 16px; border: 1px solid #ddd5df; border-radius: 8px; background: white; }
    .ssail-login { background: white; border: 1px solid #e1d9df; border-radius: 12px; }
    .ssail-login-brand { color: #a51c37; font-weight: 800; letter-spacing: .15em; }
    .ssail-login h1 { font: 700 30px/1.3 system-ui, sans-serif; margin: 20px 0; }
    .ssail-login p, .ssail-login li { font: 16px/1.7 system-ui, sans-serif; margin: 12px 0; }
    .ssail-login label { display: block; margin-top: 24px; font-weight: 700; }
    .ssail-login input { box-sizing: border-box; display: block; width: 100%; margin-top: 8px; padding: 12px; font: 16px system-ui, sans-serif; border: 1px solid #b9aeb8; border-radius: 6px; }
    .ssail-login button { margin: 4px 0 20px; padding: 12px 24px; background: #a51c37; color: white; border: 0; border-radius: 6px; cursor: pointer; font: 700 16px system-ui, sans-serif; }
    .ssail-login button:disabled { opacity: .6; cursor: wait; }
    .ssail-login .ssail-login-help { font-size: 14px; color: #655d68; }
    .ssail-login .ssail-login-error { color: #a51c37; }
    .ssail-login summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
    .ssail-login ol { padding-left: 24px; }
    .ssail-login a { color: #a51c37; text-decoration: underline; }
    @media(max-width: 720px) { #status, .ssail-login { margin: 24px 12px; padding: 24px; } }
  </style>
  <script type="module" src="./bootstrap.js"></script>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <div class="brand">SSAIL ADMIN</div>
    <h1 id="status-title">SSAIL 관리자 페이지</h1>
    <p id="status-message">게시된 홈페이지에서 GitHub 관리 키로 접속합니다. 로컬 파일(file://)에서는 로그인할 수 없습니다.</p>
    <p class="note">학부 연구생의 연도·명단·사진, 현재 구성원, 졸업생, 논문, 뉴스를 관리합니다.
      홈페이지 저장소에 쓰기 권한을 부여한 GitHub 관리 키가 필요합니다.</p>
    <p><a href="../index.html">홈페이지로 돌아가기</a> · <a href="./guide.html">설정 및 사용 안내</a></p>
  </main>
  <noscript>관리자 페이지를 사용하려면 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
